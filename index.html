ze:30px;letter-spacing:10px}.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px}.keys button{font-size:20px;margin:0;background:#eef5ef;color:#20312b}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);padding:16px 22px;border-radius:14px;background:#287044;color:#fff;font-weight:bold;box-shadow:0 10px 30px #20312b55;opacity:0;transition:.25s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.error{background:#b3261e}</style><body><main class="p"><section id="home" class="v home"><div class="home-brand">ECO PICK</div><div class="role" data-v="report"><h1>신고자</h1><p>사진과 위치를 신고합니다.</p></div><div class="role" data-v="worker"><h1>미화원</h1><p>신고를 확인하고 완료 처리합니다.</p></div></section><section id="report" class="v" hidden><button data-v="home">← 처음으로</button><div class="card"><div class="brand">ECO PICK</div><h2>신고하기</h2><form id="form">사진<input id="photo" type="file" accept="image/*" required>위치<select id="locationSelect" required><option value="">해변을 선택해 주세요</option><option>해운대 해수욕장</option><option>광안리 해수욕장</option><option>민락 수변공원</option><option>송정 해수욕장</option><option>다대포 해수욕장</option><option>송도 해수욕장</option><option>일광 해수욕장</option><option>임랑 해수욕장</option><option value="__custom">직접 입력</option></select><input id="locationDetail" class="custom-location" placeholder="상세 위치 (예: 3번 출구 앞, 주차장 옆)" hidden><input id="locationCustom" class="custom-location" placeholder="위치를 직접 입력해 주세요" hidden><input id="location" type="hidden">설명<textarea id="desc"></textarea><button>신고하기</button><p id="msg"></p></form></div></section><section id="worker" class="v" hidden><button data-v="home">← 처음으로</button><div class="brand">ECO PICK</div><h2>신고 접수 목록</h2><button class="filter active" data-filter="all">전체 신고</button><button class="filter" data-filter="open">미해결 신고만</button><div id="list" class="list"></div></section></main><div id="toast" class="toast">✓ 처리 완료되었습니다</div><div id="pin" class="pin" hidden><div class="pinbox"><b>처리 완료 PIN</b><p id="do
