<!doctype html><html lang="ko"><meta charset="utf-8"><title>ECO PICK</title><style>body{font-family:system-ui;margin:0;background:#f3f7f3;color:#20312b}.p{max-width:720px;margin:auto;padding:28px}.v[hidden]{display:none}.home{display:flex;gap:16px;min-height:100vh;align-items:center}.role,.card{background:#fff;padding:28px;border-radius:14px;border:1px solid #dfe9e1;flex:1}.role{cursor:pointer}.brand{font-weight:900;color:#287044;letter-spacing:2px}button{padding:11px 15px;border:0;border-radius:8px;background:#2e7d46;color:#fff;font-weight:bold;cursor:pointer;margin:8px 4px 8px 0}input,textarea{display:block;width:100%;box-sizing:border-box;margin:8px 0 16px;padding:10px}textarea{min-height:90px}.list{display:grid;gap:12px}.item{padding:18px;background:#fff;border-radius:12px}.done{background:#e3e7e4}.filter.active{background:#20312b}.photo{width:100%;max-height:220px;object-fit:cover}.timer{color:#a66a00;font-size:13px} .pin{position:fixed;inset:0;background:#0008;display:grid;place-items:center}.pin[hidden]{display:none}.pinbox{background:#fff;padding:24px;border-radius:16px;text-align:center}.dots{font-size:30px;letter-spacing:10px}.keys{display:grid;grid-template-columns:repeat(3,64px);gap:8px}.keys button{font-size:20px;margin:0;background:#eef5ef;color:#20312b}</style><body><main class="p"><section id="home" class="v home"><div class="role" data-v="report"><div class="brand">ECO PICK</div><h1>신고자</h1><p>사진과 위치를 신고합니다.</p></div><div class="role" data-v="worker"><div class="brand">ECO PICK</div><h1>미화원</h1><p>신고를 확인하고 완료 처리합니다.</p></div></section><section id="report" class="v" hidden><button data-v="home">← 처음으로</button><div class="card"><div class="brand">ECO PICK</div><h2>신고하기</h2><form id="form">사진<input id="photo" type="file" accept="image/*" required>위치<input id="location" required>설명<textarea id="desc"></textarea><button>신고하기</button><p id="msg"></p></form></div></section><section id="worker" class="v" hidden><button data-v="home">← 처음으로</button><div class="brand">ECO PICK</div><h2>신고 접수 목록</h2><button class="filter active" data-filter="all">전체 신고</button><button class="filter" data-filter="open">미해결 신고만</button><div id="list" class="list"></div></section></main><div id="pin" class="pin" hidden><div class="pinbox"><b>처리 완료 PIN</b><p id="dots" class="dots">○ ○ ○ ○</p><div id="keys" class="keys"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button><button>7</button><button>8</button><button>9</button><button>취소</button><button>0</button><button>←</button></div></div></div><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:"AIzaSyCJmbsoC_Gh-6_wO1_L760Sk6BiIfpv8IA",authDomain:"trash-app-4c13e.firebaseapp.com",projectId:"trash-app-4c13e"});const db=firebase.firestore(),$=s=>document.querySelector(s);let docs=[],filter='all';document.onclick=e=>{let v=e.target.closest('[data-v]');if(v){document.querySelectorAll('.v').forEach(x=>x.hidden=true);$('#'+v.dataset.v).hidden=false}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===f));draw()}};function draw(){const list=$('#list');list.replaceChildren();docs.filter(d=>filter==='all'||!d.data().is_completed).forEach(d=>{let r=d.data(),x=document.createElement('article');x.className='item'+(r.is_completed?' done':'');x.innerHTML=`<b>신고 #${d.id.slice(0,6)}</b><p>위치: ${r.location}</p><p>설명: ${r.description||''}</p>${r.photoUrl?'<img class="photo">':''}<button data-id="${d.id}" ${r.is_completed?'disabled':''}>${r.is_completed?'처리 완료됨':'처리 완료'}</button>`;if(r.photoUrl)x.querySelector('img').src=r.photoUrl;list.append(x)})}db.collection('reports').orderBy('createdAt','desc').onSnapshot(s=>{docs=s.docs;draw()});$('#list').onclick=e=>{let b=e.target.closest('[data-id]');if(b){window.targetId=b.dataset.id;window.pinCode='';$("#pin").hidden=false;$("#dots").textContent='○ ○ ○ ○'}};$('#form').onsubmit=async e=>{e.preventDefault();let file=$('#photo').files[0],data=await new Promise(ok=>{let r=new FileReader;r.onload=()=>ok(r.result);r.readAsDataURL(file)});await db.collection('reports').add({photoUrl:data,location:$('#location').value,description:$('#desc').value,is_completed:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});e.target.reset();$('#msg').textContent='저장되었습니다.'};$("#keys").onclick=e=>{let k=e.target.textContent;if(!k)return;if(k==="취소"){$("#pin").hidden=true;return}if(k==="←")window.pinCode=window.pinCode.slice(0,-1);else if(/^[0-9]$/.test(k)&&window.pinCode.length<4)window.pinCode+=k;$("#dots").textContent=[0,1,2,3].map(i=>i<window.pinCode.length?"●":"○").join(" ");if(window.pinCode.length===4){if(window.pinCode==="0729")db.collection("reports").doc(window.targetId).update({is_completed:true});else alert("PIN이 올바르지 않습니다.");$("#pin").hidden=true}};</script></body></html>
