<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075f7b">
  <title>ECO PICK</title>
  <style>
    :root { --navy:#075f7b; --blue:#1499bd; --mint:#dffbff; --ink:#163946; --coral:#ffbd4a; --line:#cce7ed; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:#eafaff; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,textarea,select { font:inherit; }
    button { border:0; border-radius:12px; padding:12px 16px; background:var(--navy); color:#fff; font-weight:800; cursor:pointer; transition:transform .18s,filter .18s,box-shadow .18s; }
    button:hover { filter:brightness(1.08); transform:translateY(-2px); }
    button:active { transform:translateY(0) scale(.97); }
    button:disabled { cursor:default; opacity:.68; transform:none; }
    input,textarea,select { width:100%; margin:7px 0 18px; padding:12px; border:1px solid #b7d9e2; border-radius:12px; background:#fff; color:var(--ink); }
    textarea { min-height:104px; resize:vertical; }
    .page { width:min(100% - 32px,980px); margin:auto; padding:28px 0 48px; }
    .view[hidden], .modal[hidden] { display:none; }
    .home { width:100%; min-height:100svh; display:grid; place-items:center; position:relative; overflow:hidden; padding:132px max(32px,5vw) 76px; background:
      radial-gradient(circle at 12% 20%,#fff9 0 3px,transparent 4px), radial-gradient(circle at 86% 25%,#fff8 0 5px,transparent 6px),
      radial-gradient(circle at 76% 74%,#fff8 0 3px,transparent 4px), linear-gradient(155deg,#eaffff 0%,#9ce5f2 48%,#35aeca 100%); }
    .home::after { content:""; position:absolute; z-index:0; bottom:-74px; left:-8%; width:116%; height:150px; border-radius:50% 50% 0 0; background:#2da9c2cc; box-shadow:0 -17px 0 #eaffffcc; }
    .brand-bubble { position:absolute; z-index:2; top:27px; left:50%; transform:translateX(-50%); padding:10px 22px 13px; border:1px solid #fff; border-radius:50% 45% 52% 48% / 45% 52% 48% 55%; color:#057199; background:radial-gradient(circle at 28% 20%,#fff 0 8%,transparent 9%),linear-gradient(135deg,#e9ffffd9,#60cce9b0); box-shadow:inset 0 2px 6px #fff,0 9px 22px #087b9a33; font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif; font-size:clamp(40px,6vw,70px); font-weight:900; letter-spacing:5px; line-height:1; white-space:nowrap; text-shadow:0 2px #ffffffcc; transition:transform .22s,filter .22s; }
    .brand-bubble:hover { transform:translateX(-50%) translateY(-4px) scale(1.04); filter:brightness(1.08); }
    .roles { z-index:1; display:grid; grid-template-columns:repeat(2,minmax(260px,360px)); gap:clamp(20px,4vw,52px); width:min(100%,780px); }
    .role { position:relative; min-height:270px; overflow:visible; padding:102px 32px 28px; border:0; border-radius:62px 78px 48px 48px; color:var(--ink); text-align:left; background:linear-gradient(180deg,#ffe17a,#f6ad2c); box-shadow:inset 0 -14px 0 #d98617,0 16px 32px #086b8735; }
    .role::before { content:""; position:absolute; top:-35px; left:31px; width:35px; height:40px; border:9px solid #ecb33a; border-bottom:0; border-radius:18px 18px 0 0; }
    .role::after { content:"⚓"; position:absolute; top:38%; right:-18px; color:#ebad2c; font-size:37px; text-shadow:0 2px #d98617; }
    .role-icon { position:absolute; top:20px; left:25px; width:51px; height:51px; display:grid; place-items:center; border:6px solid #f0bb43; border-radius:50%; background:radial-gradient(circle at 34% 28%,#e9ffff,#35a7c8); box-shadow:0 0 0 4px #17677d,0 7px 14px #0b6e9222; font-size:23px; }
    .role h1 { margin:0 0 8px; color:#075e78; font-size:clamp(30px,3vw,37px); text-shadow:0 1px #fff9; }
    .role p { margin:0; color:#176379; font-size:16px; line-height:1.6; }
    .role:hover { box-shadow:inset 0 -14px 0 #d98617,0 25px 38px #086b8740; }
    .role.pressed { animation:tap .28s ease-out; }
    @keyframes tap { 45% { transform:scale(.94); filter:brightness(1.14); } }
    .back { margin-bottom:17px; background:#39839a; }
    .panel { padding:clamp(20px,4vw,34px); border:1px solid #d8edf1; border-radius:22px; background:#ffffffed; box-shadow:0 14px 32px #22748b15; }
    .brand { color:#1182a1; font-weight:950; letter-spacing:2px; }
    h2 { margin:8px 0 24px; color:#075f7b; font-size:clamp(26px,4vw,36px); }
    label { display:block; font-weight:750; color:#1a5365; }
    .hint { display:block; margin:-10px 0 14px; color:#5c7780; font-size:13px; }
    .filters { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
    .filter { background:#d9eef2; color:#236074; }
    .filter.active { background:#075f7b; color:#fff; }
    .list { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .item { min-width:0; overflow:hidden; padding:18px; border:1px solid #d7eaee; border-radius:18px; background:#fff; box-shadow:0 7px 18px #0a6c7a0d; }
    .item.done { background:#e6eaeb; border-color:#d4dbdc; }
    .item-title { color:#0d718e; font-size:15px; }
    .item p { overflow-wrap:anywhere; line-height:1.55; }
    .photo { display:block; width:100%; max-height:220px; margin:12px 0; border-radius:12px; object-fit:cover; background:#e7f4f6; }
    .timer { color:#a46500; font-size:13px; font-weight:800; }
    .empty { grid-column:1/-1; padding:32px 18px; border-radius:16px; color:#55727a; text-align:center; background:#f6fcfd; }
    .modal { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:20px; background:#002b3b88; }
    .pinbox { width:min(100%,350px); padding:25px; border:1px solid #d6f3f6; border-radius:24px; background:linear-gradient(160deg,#f7ffff,#d9f5f7); text-align:center; box-shadow:0 20px 50px #002b3b55; }
    .pinbox h3 { margin:0 0 7px; color:#075f7b; }
    .pinbox p { margin:0 0 18px; color:#50727b; }
    .dots { min-height:45px; margin:13px 0 20px !important; color:#075f7b !important; font-size:30px; letter-spacing:10px; }
    .keys { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .keys button { min-height:54px; margin:0; padding:0; border-radius:16px; color:#164755; background:#fff; box-shadow:0 4px 0 #b8dce4; font-size:20px; }
    .keys button.action { color:#fff; background:#2d8aa2; box-shadow:0 4px 0 #1d6578; font-size:14px; }
    .toast { position:fixed; z-index:20; left:50%; bottom:max(24px,env(safe-area-inset-bottom)); width:max-content; max-width:calc(100% - 32px); padding:15px 20px; border-radius:16px; background:#087c6b; color:#fff; font-weight:800; box-shadow:0 12px 30px #003a3e55; opacity:0; pointer-events:none; transform:translate(-50%,22px); transition:.25s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast.error { background:#b6423b; }
    @media (max-width:760px) { .page{width:min(100% - 24px,680px);padding:20px 0 34px}.home{padding:132px 24px 76px}.roles{grid-template-columns:1fr;max-width:480px;gap:24px}.role{min-height:200px;padding:84px 28px 24px}.role::before{top:-29px}.role-icon{top:16px}.role h1{font-size:31px}.list{grid-template-columns:1fr}.panel{padding:22px}.brand-bubble{top:24px;font-size:clamp(39px,10vw,57px)} }
    @media (min-width:761px) and (max-width:1100px) { .page{width:min(100% - 48px,880px)}.home{padding-inline:48px}.roles{gap:28px}.role{min-height:250px;padding-inline:27px} }
    @media (max-width:390px) { .home{padding-inline:16px}.role{padding-inline:24px}.brand-bubble{letter-spacing:3px}.panel{padding:18px}.keys button{min-height:50px} }
  </style>
</head>
<body>
  <main>
    <section id="home" class="view home">
      <div class="brand-bubble">ECO PICK</div>
      <div class="roles">
        <button class="role" data-view="report" aria-label="신고자 페이지 열기"><span class="role-icon" aria-hidden="true">📷</span><h1>신고자</h1><p>사진과 위치를 남겨 해변의 쓰레기를 신고합니다.</p></button>
        <button class="role" data-view="worker" aria-label="미화원 페이지 열기"><span class="role-icon" aria-hidden="true">🧹</span><h1>미화원</h1><p>접수된 신고를 확인하고 처리 완료할 수 있습니다.</p></button>
      </div>
    </section>
    <section id="report" class="view" hidden=""><div class="page"><button class="back" data-view="home">← 처음으로</button><div class="panel"><div class="brand">ECO PICK</div><h2>신고하기</h2><form id="form"><label for="photo">사진 첨부</label><input id="photo" type="file" accept="image/*" required=""><label for="locationSelect">위치</label><select id="locationSelect" required=""><option value="">해변을 선택해 주세요</option><option>해운대 해수욕장</option><option>광안리 해수욕장</option><option>민락 수변공원</option><option>송정 해수욕장</option><option>다대포 해수욕장</option><option>송도 해수욕장</option><option>일광 해수욕장</option><option>임랑 해수욕장</option><option value="__custom">직접 입력</option></select><input id="locationDetail" placeholder="상세 위치 (예: 3번 출구 앞, 주소 등)" hidden=""><input id="locationCustom" placeholder="위치를 직접 입력해 주세요" hidden=""><label for="desc">상세 설명</label><textarea id="desc" placeholder="쓰레기 상태나 주변 상황을 적어 주세요."></textarea><button id="submitButton" type="submit">신고하기</button><p id="msg" aria-live="polite"></p></form></div></div></section>
    <section id="worker" class="view" hidden=""><div class="page"><button class="back" data-view="home">← 처음으로</button><div class="brand">ECO PICK</div><h2>신고 접수 목록</h2><div class="filters"><button class="filter active" data-filter="all">전체 신고</button><button class="filter" data-filter="open">미해결 신고만</button></div><div id="list" class="list" aria-live="polite"><div class="empty">접수된 신고가 없습니다.</div></div></div></section>
  </main>
  <div id="pin" class="modal" hidden=""><div class="pinbox" role="dialog" aria-modal="true" aria-labelledby="pinTitle"><h3 id="pinTitle">처리 완료 PIN</h3><p>4자리 PIN을 입력해 주세요.</p><div id="dots" class="dots" aria-label="입력한 PIN 자리 수">○ ○ ○ ○</div><div id="keys" class="keys"><button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button><button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button><button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button><button type="button" class="action" data-key="cancel">취소</button><button type="button" data-key="0">0</button><button type="button" class="action" data-key="back">←</button></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./index_files/firebase-app-compat.js.다운로드"></script>
  <script src="./index_files/firebase-firestore-compat.js.다운로드"></script>
  <script>
    const firebaseConfig={apiKey:"AIzaSyCJmbsoC_Gh-6_wO1_L760Sk6BiIfpv8IA",authDomain:"trash-app-4c13e.firebaseapp.com",projectId:"trash-app-4c13e",storageBucket:"trash-app-4c13e.firebasestorage.app",messagingSenderId:"908284674035",appId:"1:908284674035:web:03a89aec6024058dc99c86",measurementId:"G-PQWCW0GRFG"};
    firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
    const $=s=>document.querySelector(s); let reports=[], activeFilter='all', targetId='', pinCode='';
    function showView(id){ document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!==id); window.scrollTo({top:0,behavior:'smooth'}); }
    document.addEventListener('click',e=>{ const view=e.target.closest('[data-view]'); if(view){ if(view.classList.contains('role')){view.classList.add('pressed'); setTimeout(()=>{view.classList.remove('pressed');showView(view.dataset.view)},160);} else showView(view.dataset.view); } const filter=e.target.closest('[data-filter]'); if(filter){activeFilter=filter.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===filter));draw();} });
    function text(tag,value,className){const el=document.createElement(tag);el.textContent=value;if(className)el.className=className;return el;}
    function createdMillis(data){return data.createdAt&&typeof data.createdAt.toMillis==='function'?data.createdAt.toMillis():Date.now();}
    function timeLeft(data){const left=86400000-(Date.now()-createdMillis(data)); if(left<=0)return '삭제 예정'; const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000),s=Math.floor(left%60000/1000);return `삭제까지 ${h}시간 ${m}분 ${s}초`;}
    function draw(){const list=$('#list');list.replaceChildren();const visible=reports.filter(r=>activeFilter==='all'||!r.data.is_completed);if(!visible.length){list.append(text('div',activeFilter==='open'?'미해결 신고가 없습니다.':'접수된 신고가 없습니다.','empty'));return;} visible.forEach(({id,data})=>{const card=document.createElement('article');card.className='item'+(data.is_completed?' done':'');card.append(text('b',`신고 #${id.slice(0,6)}`,'item-title'),text('p',`위치: ${data.location||'-'}`),text('p',`설명: ${data.description||'-'}`));if(data.photoUrl){const img=document.createElement('img');img.className='photo';img.alt='신고 사진';img.src=data.photoUrl;card.append(img);}card.append(text('p',timeLeft(data),'timer'));const button=document.createElement('button');button.type='button';button.disabled=Boolean(data.is_completed);button.textContent=data.is_completed?'처리 완료됨':'처리 완료';button.dataset.id=id;card.append(button);list.append(card);});}
    function toast(message,isError=false){const el=$('#toast');el.textContent=message;el.className='toast show'+(isError?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='toast',3000);}
    function purgeExpired(){reports.filter(r=>Date.now()-createdMillis(r.data)>=86400000).forEach(r=>db.collection('reports').doc(r.id).delete().catch(()=>{}));}
    db.collection('reports').orderBy('createdAt','desc').onSnapshot(snapshot=>{reports=snapshot.docs.map(d=>({id:d.id,data:d.data()}));purgeExpired();draw();},()=>{draw();toast('신고 목록을 불러오지 못했습니다.',true);});
    setInterval(()=>{purgeExpired();draw();},1000);
    const select=$('#locationSelect'),detail=$('#locationDetail'),custom=$('#locationCustom');
    function syncLocation(){const isCustom=select.value==='__custom',isPreset=select.value&& !isCustom;custom.hidden=!isCustom;detail.hidden=!isPreset;custom.required=isCustom;detail.required=isPreset;}
    select.addEventListener('change',()=>{syncLocation();(select.value==='__custom'?custom:detail).focus();});
    $('#form').addEventListener('submit',async event=>{event.preventDefault();const file=$('#photo').files[0];const location=select.value==='__custom'?custom.value.trim():`${select.value} - ${detail.value.trim()}`;if(!file||!location){toast('사진과 위치를 확인해 주세요.',true);return;}if(file.size>700000){toast('사진 용량이 큽니다. 700KB 이하 사진으로 다시 시도해 주세요.',true);return;}const button=$('#submitButton');button.disabled=true;button.textContent='저장 중…';try{const photoUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});await db.collection('reports').add({photoUrl,location,description:$('#desc').value.trim(),is_completed:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});event.target.reset();syncLocation();$('#msg').textContent='신고가 접수되었습니다.';}catch(error){const denied=error&&error.code==='permission-denied';$('#msg').textContent=denied?'저장 권한이 없습니다. 관리자에게 Firestore 규칙 설정을 요청해 주세요.':'저장에 실패했습니다. 인터넷 연결을 확인해 주세요.';toast(denied?'Firestore 저장 권한이 설정되지 않았습니다.':'신고 저장에 실패했습니다.',true);}finally{button.disabled=false;button.textContent='신고하기';}});
    $('#list').addEventListener('click',e=>{const button=e.target.closest('[data-id]');if(!button||button.disabled)return;targetId=button.dataset.id;pinCode='';updateDots();$('#pin').hidden=false;});
    function updateDots(){$('#dots').textContent=[0,1,2,3].map(i=>i<pinCode.length?'●':'○').join(' ');}
    $('#keys').addEventListener('click',e=>{const key=e.target.dataset.key;if(!key)return;if(key==='cancel'){$('#pin').hidden=true;return;}if(key==='back')pinCode=pinCode.slice(0,-1);else if(pinCode.length<4)pinCode+=key;updateDots();if(pinCode.length===4){if(pinCode!=='0729'){toast('PIN이 올바르지 않습니다.',true);pinCode='';updateDots();return;}db.collection('reports').doc(targetId).update({is_completed:true}).then(()=>toast('✓ 처리 완료되었습니다.')).catch(()=>toast('처리 상태를 저장하지 못했습니다.',true)).finally(()=>$('#pin').hidden=true);}});
    syncLocation();
  </script>


</body></html>
